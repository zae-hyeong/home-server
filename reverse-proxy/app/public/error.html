<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Proxy Test - Error Page</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(30, 41, 59, 0.45);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-error: #f43f5e;
            --accent-glow: rgba(244, 63, 94, 0.15);
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Ambient glowing background blobs */
        .blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 0;
            filter: blur(40px);
            pointer-events: none;
        }
        .blob-1 {
            top: 10%;
            left: 15%;
        }
        .blob-2 {
            bottom: 10%;
            right: 15%;
            background: radial-gradient(circle, rgba(244, 63, 94, 0.12) 0%, rgba(0,0,0,0) 70%);
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 580px;
        }

        /* Glassmorphism Card */
        .error-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }

        .error-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 40px rgba(99, 102, 241, 0.1);
        }

        /* Icon Wrapper & Glowing Effect */
        .icon-wrapper {
            position: relative;
            width: 88px;
            height: 88px;
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.2);
            border-radius: 50%;
            box-shadow: 0 0 25px var(--accent-glow);
            animation: pulse 2s infinite alternate;
        }

        .icon-wrapper svg {
            width: 42px;
            height: 42px;
            color: var(--accent-error);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 15px rgba(244, 63, 94, 0.1);
                transform: scale(0.98);
            }
            100% {
                box-shadow: 0 0 30px rgba(244, 63, 94, 0.3);
                transform: scale(1.02);
            }
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 16px;
            background: linear-gradient(to right, #ffffff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .error-code {
            display: inline-block;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-error);
            background: rgba(244, 63, 94, 0.1);
            padding: 4px 12px;
            border-radius: 9999px;
            margin-bottom: 24px;
            border: 1px solid rgba(244, 63, 94, 0.15);
        }

        p.description {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        /* Detail List */
        .detail-box {
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            margin-bottom: 32px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .detail-item:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            color: var(--text-secondary);
        }

        .detail-val {
            font-family: monospace;
            color: var(--text-primary);
            font-weight: 500;
        }

        .status-badge {
            color: var(--success-color);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success-color);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--success-color);
        }

        /* Action Buttons */
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Responsive Design */
        @media (max-width: 640px) {
            .error-card {
                padding: 32px 24px;
                border-radius: 20px;
            }
            h1 {
                font-size: 1.75rem;
            }
            .actions {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <div class="error-card">
            <div class="icon-wrapper">
                <!-- SVG Warning Alert Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                </svg>
            </div>
            
            <div class="error-code">Reverse Proxy Test</div>
            <h1>테스트 에러 페이지</h1>
            <p class="description">
                이 페이지는 <code>error.zae-hyeong.cloud</code> 주소를 통해 리버스 프록시가 요청을 올바르게 감지하고 정적 HTML을 응답하는지 검증하기 위한 테스트용 페이지입니다.
            </p>

            <div class="detail-box">
                <div class="detail-item">
                    <span class="detail-label">도메인 (Requested Host)</span>
                    <span class="detail-val" id="host-name">error.zae-hyeong.cloud</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">응답 상태 (HTTP Status)</span>
                    <span class="detail-val" style="color: var(--accent-error);">500 Internal Error</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">프록시 상태 (Engine Status)</span>
                    <span class="detail-val status-badge">
                        <span class="status-dot"></span>
                        Active & Running
                    </span>
                </div>
            </div>

            <div class="actions">
                <a href="http://localhost" class="btn btn-secondary">프록시 관리자 대시보드</a>
                <span onclick="window.location.reload();" class="btn btn-primary">새로고침</span>
            </div>
        </div>
    </div>

    <script>
        // Update host name dynamically based on window location if it matches
        if (window.location.host) {
            document.getElementById('host-name').textContent = window.location.host;
        }
    </script>
</body>
</html>
