events {}

http {
    # WebSocket 지원을 위한 맵핑 설정
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 1. HTTP -> HTTPS 자동 리다이렉션 (도메인 접속용)
    server {
        listen 80;
        server_name zaehyeong.cloud *.zaehyeong.cloud zae-hyeong.cloud *.zae-hyeong.cloud;

        # Let's Encrypt HTTP Challenge 경로
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 모든 요청을 HTTPS로 리다이렉션 (301 Moved Permanently)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTP 로컬 개발 및 테스트용 바이패스 (localhost 및 127.0.0.1)
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        location / {
            proxy_pass http://app_service:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # 3. HTTPS 통합 바이패스 (인증서 발급 완료 시 아래 주석을 해제하여 사용하세요)
